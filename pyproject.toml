[project]
name = "model-check-core"
version = "0.1.0"
description = "Fast, lightweight black-box diagnostic & inspection tool for LLM API channels (L1 protocol, tools, vision, streaming)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Model Check Team", email = "contact@model-check.org" }
]
keywords = ["llm", "api", "relay", "diagnostic", "anthropic", "openai", "inspector", "checker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
model-check = "model_check.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["model_check*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
